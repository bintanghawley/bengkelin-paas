# Nixpacks configuration for Railway deployment of Bengkelin PaaS (Laravel 12)

[phases.setup]
nixPkgs = [
    "php82",
    "php82Packages.composer",
    "php82Extensions.pdo_pgsql",
    "php82Extensions.pdo_mysql",
    "php82Extensions.gd",
    "php82Extensions.mbstring",
    "php82Extensions.fileinfo",
    "php82Extensions.bcmath",
    "php82Extensions.curl",
    "php82Extensions.zip",
    "nodejs_20"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm install"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan optimize:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
